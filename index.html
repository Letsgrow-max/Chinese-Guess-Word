<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chinese Guess Word</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
</head>
<body>
    <div id="app">
        <!-- Top Navigation / Status Bar -->
        <header>
            <div id="nav-left">
                <button id="btn-back" class="icon-btn hidden">⬅️</button>
            </div>
            <div id="nav-right">
                <span class="coin-display">🪙 <span id="coin-count">0</span></span>
            </div>
        </header>

        <!-- Home Screen -->
        <main id="screen-home" class="screen">
            <div class="hero">
                <h1>字谜<span>乐园</span></h1>
                <p>Word Puzzle Paradise</p>
            </div>
            <div class="level-select" id="level-list">
                <!-- Level buttons generated by JS -->
            </div>
        </main>

        <!-- Game Screen -->
        <main id="screen-game" class="screen hidden">
            <div class="target-card">
                <h1 id="target-char">星</h1>
                <h2 id="target-pinyin">xīng</h2>
                <div class="meanings">
                    <p><strong>EN:</strong> <span id="target-en">Star</span></p>
                    <p><strong>CN:</strong> <span id="target-cn">夜空中的星体；发光的天体。</span></p>
                </div>
            </div>

            <div class="game-status">
                <div class="stars" id="star-container">
                    <!-- Stars generated by JS -->
                </div>
                <button id="btn-hint" class="hint-btn">💡 Hint (20 🪙)</button>
            </div>

            <div class="progress-area">
                <p>Found: <span id="found-count">0</span> / <span id="total-count">0</span></p>
                <div id="discovered-list" class="discovered-tiles">
                    <!-- Discovered tiles appear here -->
                </div>
            </div>

            <div class="grid-container" id="tile-grid">
                <!-- Character tiles generated by JS -->
            </div>
        </main>

        <!-- Result Screen -->
        <main id="screen-result" class="screen hidden">
            <div class="result-card">
                <h1 id="result-title">Level Complete!</h1>
                <p id="result-message">You found all the characters.</p>
                <div class="reward">
                    <span class="big-coin">🪙 +<span id="reward-coins">10</span></span>
                </div>
                <button id="btn-next" class="primary-btn">Next Level</button>
                <button id="btn-home" class="secondary-btn">Back to Menu</button>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
    <script>
        // Register Service Worker for PWA offline capabilities
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => console.log('Service Worker registered'))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
